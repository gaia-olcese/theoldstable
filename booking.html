<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - The Old Stable</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
</head>
<body>
    <header>
        <h1>Book Your Stay</h1>
    </header>
    
    <main class="booking-container">
        <section class="booking-info">
            <h2>How to Book</h2>
            <p>Booking your stay at The Old Stable is simple! You can reserve a date through Airbnb:</p>
            <ul>
                <li><a href="#">Book on Airbnb</a></li>
            </ul>
            <p>Or book with us directly for the best price!.</p>
        </section>
        
        <aside class="calendar">
            <h2>Availability Calendar</h2>
            <!-- Embed your booking calendar here, e.g., an iframe or a third-party widget -->
            <iframe src="calendar.html" width="100%" height="400px" frameborder="0"></iframe>
        </aside>
    </main>
</body>
</html>
