<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Old Stable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #5D4037;
            margin: 0;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 50px;
            background-color: #8F9C69;
            color: #EEF1E8;
        }

        section {
            margin: 20px auto;
            width: 80%;
            max-width: 1000px;
        }

        .gallery-section {
            text-align: center;
        }

        .gallery-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 10px 0;
        }

        .gallery {
            display: flex;
            gap: 10px;
        }

        .gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #5D4037;
        }

        .location-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px auto;
            width: 90%;
            max-width: 1200px;
        }

        .map-calendar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .map-calendar iframe {
            flex: 1;
            min-width: 400px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <header>
        <h1>Welcome to The Old Stable</h1>
    </header>

    <section>
        <h2>Meet the team</h2>
        <div class="photos">
            <img src="gaia_adam.jpg" alt="Gaia & Adam">
            <img src="nya.jpg" alt="Nya">
            <img src="freya.jpg" alt="Freya">
        </div>
    </section>

    <section class="gallery-section">
        <h2>Gallery</h2>
        <div class="gallery-container">
            <div class="gallery">
                <img src="exterior.png" alt="Exterior view">
                <img src="living_room_1.png" alt="Living room">
                <img src="living_room_2.png" alt="Living room">
                <img src="living_room_3.png" alt="Living room">
                <img src="bedroom_1.png" alt="Bedroom">
                <img src="bedroom_2.png" alt="Bedroom">
                <img src="bathroom_1.png" alt="Bathroom">
                <img src="bathroom_2.png" alt="Bathroom">
            </div>
        </div>
    </section>

    <section class="location-container">
        <div class="location">
            <h2>Location</h2>
            <p>Horse Street, Chipping Sodbury, BS37 6DA</p>
        </div>
    </section>

    <div class="map-calendar">
        <iframe src="https://www.google.com/maps/embed?..." width="600" height="450" style="border:0;" allowfullscreen></iframe>
        <iframe src="https://calendar.google.com/calendar/embed?src=..." width="600" height="450" frameborder="0" scrolling="no"></iframe>
    </div>

    <footer>
        <p>&copy; 2025 The Old Stable. All Rights Reserved.</p>
    </footer>
</body>
</html>
